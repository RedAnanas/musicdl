services:
  musicdl-web:
    image: ${MUSICDL_IMAGE:-redananas/musicdl:latest}
    container_name: musicdl-web
    ports:
      - "5000:5000"
    environment:
      MUSICDL_HOST: 0.0.0.0
      MUSICDL_DOWNLOAD_DIR: ${MUSICDL_DOWNLOAD_DIR:-/Media/musicdl}
      MUSICDL_SETTINGS_PATH: /data/settings.json
    volumes:
      - ./data:/data
      - /vol2/1000/Media:/Media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
